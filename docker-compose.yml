name: amisostock
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: amisostock
      POSTGRES_DB: amisostock
      POSTGRES_PASSWORD: password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amisostock -d amisostock']
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:8
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-n', '1', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
  redis-data:
